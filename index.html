  <script>
    /* apply saved theme/language before paint to avoid a flash */
    (function () {
      var q = new URLSearchParams(location.search), s = {};
      try { s.theme = localStorage.getItem("theme"); s.lang = localStorage.getItem("lang"); } catch (e) {}
      var theme = q.get("theme") || s.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      var lang = q.get("lang") || s.lang || "en";
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.lang = lang === "ar" ? "ar" : "en";
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    })();
  </script>
